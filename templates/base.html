<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<!-- <div id="overlay" class="overlay"></div> -->

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <h2>
        <a href="/home" class="logo-link">⚡ E-service</a>
    </h2>

    <ul>
        <!-- <li><a href="/home" class="menu-item">Home</a></li>
        <li><a href="/dashboard" class="menu-item active">Dashboard</a></li>
        <li><a href="/users" class="menu-item">Users</a></li>
        <li><a href="/technicians" class="menu-item">Technicians</a></li>
        <li><a href="/booking" class="menu-item">Booking</a></li>
        <li><a href="/customers" class="menu-item">Customers</a></li> -->

        <li>
            <a href="/home" class="menu-item {{ 'active' if current_path == '/home' else '' }}">Home</a>
        </li>

        <li>
            <a href="/dashboard" class="menu-item {{ 'active' if current_path == '/dashboard' else '' }}">Dashboard</a>
        </li>

        <li>
            <a href="/users" class="menu-item {{ 'active' if current_path == '/users' else '' }}">Users</a>
        </li>

        <li>
            <a href="/technicians" class="menu-item {{ 'active' if current_path == '/technicians' else '' }}">Technicians</a>
        </li>

        <li>
            <a href="/booking" class="menu-item {{ 'active' if current_path == '/booking' else '' }}">Booking</a>
        </li>

        <li>
            <a href="/customers" class="menu-item {{ 'active' if current_path == '/customers' else '' }}">Customers</a>
        </li>
    </ul>
</div>

<!-- ===== MAIN ===== -->
<div class="main" id="main">

    <!-- ===== TOPBAR ===== -->
    <div class="topbar-pro">
        <div class="topbar-left">
            <span class="toggle-btn" onclick="toggleSidebar()">☰</span>
            <h3>Welcome, {{ session['username'] }}</h3>
        </div>

<!--         <div class="topbar-right">
            <span>🔔 3</span>
            <div class="profile-circle">
                <span id="initial"></span>
            </div>
            <span>{{ session['username'] }}</span>
        </div> -->

        <div class="topbar-right">

            <div class="notification">
                🔔
                <span class="badge">3</span>
            </div>

            <div class="profile-dropdown">
                <div class="profile-box" id="profileBtn">
                    <div class="profile-circle">
                        <span id="initial"></span>
                    </div>
                    <span class="username">{{ session['username'] }}</span>
                </div>

                <div class="dropdown-menu" id="profileDropdown">
                    <div class="dropdown-header">{{ session['username'] }}</div>
                    <div class="dropdown-divider"></div>

                    <a href="/profile" class="dropdown-item">Profile</a>

                    <div class="dropdown-divider"></div>

                    <a href="/logout" class="dropdown-item logout">Logout</a>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== PAGE CONTENT ===== -->
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- CLOCK -->
<div class="live-time" id="liveTime"></div>

<script src="{{ url_for('static', filename='base.js') }}"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
